<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Atatürk AR Sergi — Küçükçekmece</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; }

        /* --- 1. AŞAMA: TARAMA EKRANI --- */
        #scanner-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; z-index: 10; }
        
        #scan-hint {
            position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(230, 57, 70, 0.9); color: white; padding: 15px 30px;
            border-radius: 50px; font-size: 16px; font-weight: bold; z-index: 15; 
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); white-space: nowrap;
        }

        /* Flaş Butonu */
        #flash-btn {
            position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.2); color: white; padding: 10px 20px;
            border: 1px solid white; border-radius: 20px; font-size: 14px; font-weight: bold;
            z-index: 15; cursor: pointer; backdrop-filter: blur(5px); transition: 0.3s;
        }

        /* --- 2. AŞAMA: MODEL EKRANI --- */
        #viewer-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100vh; z-index: 20;
            display: none; background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
        }
        
        #ar-element { width: 100%; height: 100%; }

        /* Kırmızı Buton (Özel Slot) */
        #ar-button {
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            padding: 20px 40px; background-color: #e63946; color: white;
            border: none; border-radius: 50px; font-size: 20px; font-weight: bold;
            box-shadow: 0 10px 25px rgba(230, 57, 70, 0.4); z-index: 1000; cursor: pointer;
        }

        .hint-text {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: #bdc3c7; font-size: 13px; z-index: 999;
        }

        .a-enter-vr { display: none !important; }
    </style>
</head>
<body>

    <div id="scan-hint">📷 Anahtarlığı Kameraya Gösterin</div>
    <button id="flash-btn">💡 Flaş Aç / Kapat</button>
    <div id="scanner-screen">
        <a-scene mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no; uiScanning: no;" color-space="sRGB" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            <a-entity mindar-image-target="targetIndex: 0" id="target-entity"></a-entity>
        </a-scene>
    </div>

    <div id="viewer-screen">
        <model-viewer 
            id="ar-element"
            src="./3d.glb" 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            auto-rotate
            shadow-intensity="2"
            exposure="1.2"
            environment-image="neutral"
            orientation="0deg 0deg 0deg"
            touch-action="pan-y">
            
            <button slot="ar-button" id="ar-button">🚀 SERGİYİ BAŞLAT</button>
            <div class="hint-text" id="hint-text">Modeli döndürebilirsiniz. Sergiyi başlatınca odaya yerleşir.</div>
        </model-viewer>
    </div>

    <script>
        const targetEntity = document.querySelector('#target-entity');
        const scannerScreen = document.querySelector('#scanner-screen');
        const scanHint = document.querySelector('#scan-hint');
        const flashBtn = document.querySelector('#flash-btn');
        const viewerScreen = document.querySelector('#viewer-screen');
        const arBtn = document.querySelector("#ar-button");
        const hintText = document.querySelector("#hint-text");

        // --- 1. FLAŞ SİSTEMİ ---
        let flashOn = false;
        flashBtn.addEventListener('click', async () => {
            // Kameraları bul
            const video = document.querySelector('video');
            if (video && video.srcObject) {
                const track = video.srcObject.getVideoTracks()[0];
                const capabilities = track.getCapabilities();
                
                // Telefonun flaş özelliği varsa
                if (capabilities.torch) {
                    flashOn = !flashOn;
                    try {
                        await track.applyConstraints({ advanced: [{ torch: flashOn }] });
                        flashBtn.style.backgroundColor = flashOn ? "rgba(241, 196, 15, 0.8)" : "rgba(255, 255, 255, 0.2)";
                        flashBtn.style.color = flashOn ? "black" : "white";
                    } catch (err) {
                        console.log("Flaş hatası:", err);
                    }
                } else {
                    alert("Bu cihaz tarayıcı üzerinden flaş kullanımını desteklemiyor.");
                }
            }
        });

        // --- 2. ANAHTARLIK OKUNDUĞUNDA (KASMA ÇÖZÜMÜ) ---
        targetEntity.addEventListener('targetFound', () => {
            // A-Frame sistemini ve kamerayı TAMAMEN durdur, RAM'i temizle
            const aScene = document.querySelector('a-scene');
            aScene.systems["mindar-image-system"].stop();
            
            // Tarama ekranını tamamen sil (kasmanın önüne geçer)
            scannerScreen.remove();
            scanHint.remove();
            flashBtn.remove();
            
            // Model ekranını aç
            viewerScreen.style.display = 'block';
        });

        // --- 3. AR MODU BAŞLAYINCA BUTONLARI GİZLE ---
        const viewer = document.querySelector("#ar-element");
        viewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                hintText.style.display = 'none';
            } else if (event.detail.status === 'not-presenting') {
                hintText.style.display = 'block';
            }
        });
    </script>
</body>
</html>
