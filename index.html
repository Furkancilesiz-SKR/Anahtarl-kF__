<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Küçükçekmece AR - v6</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    
    #baslat-ekrani {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: white; font-family: sans-serif;
    }
    
    #baslat-btn {
      padding: 15px 30px; font-size: 20px; font-weight: bold; color: white;
      background: #28a745; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px;
    }

    #surum { position: fixed; top: 10px; right: 10px; color: lime; z-index: 1000; font-family: monospace; }
    #gelistirici { position: fixed; bottom: 10px; width: 100%; text-align: center; color: gray; z-index: 1000; font-family: sans-serif; font-size: 12px; }
  </style>
</head>
<body>

  <div id="baslat-ekrani">
    <h2>AR Sistemine Hoş Geldiniz</h2>
    <button id="baslat-btn">KAMERAYI AÇ</button>
  </div>

  <div id="surum">v6.0.0</div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <video id="video-ataturk" src="./ataturk.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0" id="hedef-logo">
      <a-plane material="src: #video-ataturk;" position="0 0 0" height="1" width="1.77" rotation="0 0 0"></a-plane>
    </a-entity>
  </a-scene>

  <div id="gelistirici">Geliştirici: Esmanur Çaça</div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const btn = document.querySelector('#baslat-btn');
      const ekran = document.querySelector('#baslat-ekrani');
      const sahne = document.querySelector('a-scene');
      const video = document.querySelector('#video-ataturk');
      const hedef = document.querySelector('#hedef-logo');

      btn.addEventListener('click', function() {
        ekran.style.display = 'none';
        video.muted = false;
        video.play().then(() => video.pause()).catch(e => console.log(e));
        sahne.systems["mindar-image-system"].start();
      });

      hedef.addEventListener("targetFound", () => video.play());
      hedef.addEventListener("targetLost", () => video.pause());
    });
  </script>
</body>
</html>
