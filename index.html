<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Küçükçekmece AR - Video</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
    }
    
    #version-log {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #00ff00;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      z-index: 1000;
      font-size: 12px;
      border: 1px solid #555;
    }

    #developer-tag {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      z-index: 1000;
      font-family: sans-serif;
      font-size: 14px;
      text-shadow: 1px 1px 2px black;
    }

    /* Ekrana dokunma uyarısı */
    #tap-to-play {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 0, 0, 0.8);
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      font-family: sans-serif;
      font-size: 18px;
      z-index: 2000;
      cursor: pointer;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="version-log">
    v2.1.0 - Video Oynatma Düzeltmesi
  </div>

  <div id="tap-to-play">Sesi Açmak ve Videoyu Başlatmak İçin<br>Ekrana Dokunun</div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" 
           color-space="sRGB" 
           renderer="colorManagement: true, physicallyCorrectLights" 
           vr-mode-ui="enabled: false" 
           device-orientation-permission-ui="enabled: false">
           
    <a-assets>
      <video id="ataturk-vid" src="./ataturk.mp4" preload="auto" autoplay loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="ar-target">
      <a-video src="#ataturk-vid" position="0 0 0" height="1" width="1.77" rotation="0 0 0"></a-video>
    </a-entity>
  </a-scene>

  <div id="developer-tag">
    Geliştirici: Esmanur Çaça
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const target = document.querySelector('#ar-target');
      const vid = document.querySelector('#ataturk-vid');
      const tapBtn = document.querySelector('#tap-to-play');

      // Ekrana herhangi bir yere dokunulduğunda sesi aç ve uyarıyı gizle
      document.body.addEventListener('click', () => {
        vid.muted = false; // Sesi aç
        vid.play();        // Videoyu tetikle
        tapBtn.style.display = 'none'; // Kırmızı butonu sakla
      });

      target.addEventListener("targetFound", () => {
        console.log("Logo Algılandı!");
        vid.play(); 
      });

      target.addEventListener("targetLost", () => {
        console.log("Logo Kaybedildi!");
        vid.pause(); 
      });
    });
  </script>
</body>
</html>
