<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atatürk AR Test</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        /* A-Frame'in sağ alttaki gereksiz butonunu gizle */
        .a-enter-vr { display: none !important; }
    </style>
</head>
<body>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="ataturkModel" src="./3d.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-light type="ambient" color="#FFF" intensity="1.5"></a-light>
            
            <a-gltf-model rotation="0 0 0" position="-1 0 0" scale="1 1 1" src="#ataturkModel"></a-gltf-model>
        </a-entity>

    </a-scene>

</body>
</html>
