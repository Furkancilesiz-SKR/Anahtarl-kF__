<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Küçükçekmece AR - Kesin Çözüm</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #222; 
    }
    
    /* Telefon engellerini aşmak için Başlangıç Ekranı */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    #start-btn {
      padding: 15px 40px;
      font-size: 18px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 30px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    
    #start-btn:active {
      transform: scale(0.95);
    }

    #version-log {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #00ff00;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      z-index: 1000;
      font-size: 12px;
      border: 1px solid #555;
    }

    #developer-tag {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      z-index: 1000;
      font-family: sans-serif;
      font-size: 14px;
      text-shadow: 1px 1px 2px black;
    }
  </style>
</head>
<body>

  <div id="start-screen">
    <h2>AR Deneyimine Hoş Geldiniz</h2>
    <p>Ses ve görüntü kısıtlamalarını kaldırmak<br>için lütfen başlat butonuna basın.</p>
    <button id="start-btn">KAMERAYI BAŞLAT</button>
  </div>

  <div id="version-log">
    v3.0.0 - Düzlem Video ve Manuel Başlatma
  </div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" 
           color-space="sRGB" 
           renderer="colorManagement: true, physicallyCorrectLights" 
           vr-mode-ui="enabled: false" 
           device-orientation-permission-ui="enabled: false">
           
    <a-assets>
      <video id="ataturk-vid" src="./ataturk.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="ar-target">
      <a-plane material="src: #ataturk-vid; transparent: false;" position="0 0 0" height="1" width="1.77" rotation="0 0 0"></a-plane>
    </a-entity>
  </a-scene>

  <div id="developer-tag">
    Geliştirici: Esmanur Çaça
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const startBtn = document.querySelector('#start-btn');
      const startScreen = document.querySelector('#start-screen');
      const sceneEl = document.querySelector('a-scene');
      const vid = document.querySelector('#ataturk-vid');
      const target = document.querySelector('#ar-target');

      // Butona tıklandığında AR motorunu ve videoyu zorla uyandırıyoruz
      startBtn.addEventListener('click', function() {
        startScreen.style.display = 'none'; // Siyah perdeyi kaldır
        
        // Ses engelini kaldır ve videoyu bir saliseliğine oynatıp duraklat
        vid.muted = false;
        vid.play().then(() => {
          vid.pause(); // Logoyu görene kadar beklemede kalacak
        }).catch((err) => {
          console.warn("Video önbelleğe alınamadı:", err);
        });

        // AR kamerasını başlat
        sceneEl.systems["mindar-image-system"].start();
      });

      // Kamera logoyu bulduğunda
      target.addEventListener("targetFound", () => {
        console.log("Logo Algılandı, Video Oynatılıyor!");
        vid.play(); 
      });

      // Kamera logoyu kaybettiğinde
      target.addEventListener("targetLost", () => {
        console.log("Logo Kaybedildi, Video Duraklatıldı!");
        vid.pause(); 
      });
    });
  </script>
</body>
</html>
