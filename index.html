<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Küçükçekmece AR - Son Sürüm</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #111; }
    
    /* Başlangıç Ekranı: Tarayıcı engellerini aşmak için şart */
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 9999; display: flex; flex-direction: column;
      justify-content: center; align-items: center; background: rgba(0,0,0,0.9);
      color: white; font-family: sans-serif; text-align: center;
    }
    
    #start-btn {
      padding: 15px 40px; font-size: 18px; font-weight: bold; color: white;
      background: #007bff; border: none; border-radius: 8px; cursor: pointer;
      margin-top: 20px; box-shadow: 0 4px 10px rgba(0,123,255,0.5);
    }

    #version-box {
      position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8);
      color: #00ff00; padding: 8px 12px; border-radius: 5px; font-family: monospace;
      z-index: 1000; font-size: 14px; border: 1px solid #00ff00;
    }

    #developer-tag {
      position: fixed; bottom: 10px; width: 100%; text-align: center;
      color: rgba(255, 255, 255, 0.5); z-index: 1000; font-family: sans-serif; font-size: 12px;
    }
  </style>
</head>
<body>

  <div id="ui-layer">
    <h2>Küçükçekmece AR Deneyimi</h2>
    <p>Kamerayı ve videoyu başlatmak için tıklayın.</p>
    <button id="start-btn">SİSTEMİ BAŞLAT</button>
  </div>

  <div id="version-box">v5.0.0 - Final</div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" 
           color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
           
    <a-assets>
      <video id="ataturk-vid" src="./ataturk.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
