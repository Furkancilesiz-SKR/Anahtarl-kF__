<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Atatürk AR Projesi</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
    }
    
    /* Sürüm Log Kutusu */
    #version-log {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #00ff00;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      z-index: 1000;
      font-size: 12px;
      border: 1px solid #555;
    }

    /* Geliştirici İmzası */
    #developer-tag {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      z-index: 1000;
      font-family: sans-serif;
      font-size: 14px;
      text-shadow: 1px 1px 2px black;
    }
  </style>
</head>
<body>

  <div id="version-log">
    v1.1.0 - AR Altyapısı ve Model Eklendi
  </div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 0.01" 
           color-space="sRGB" 
           renderer="colorManagement: true, physicallyCorrectLights" 
           vr-mode-ui="enabled: false" 
           device-orientation-permission-ui="enabled: false">
           
    <a-assets>
      <a-asset-item id="ataturkModel" src="./ataturk.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="ar-target">
      
      <a-gltf-model id="ataturkEntity"
                    src="#ataturkModel" 
                    position="0 -0.5 0" 
                    scale="0 0 0" 
                    rotation="0 0 0"
                    visible="false">
      </a-gltf-model>
      
    </a-entity>
  </a-scene>

  <div id="developer-tag">
    Geliştirici: Furkan Çilesiz
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const target = document.querySelector('#ar-target');
      const ataturkEntity = document.querySelector('#ataturkEntity');
      let displayTimer;

      // Kamera anahtarlığı gördüğünde çalışacak kodlar
      target.addEventListener("targetFound", () => {
        console.log("Anahtarlık Algılandı!");
        
        // Modeli görünür yap
        ataturkEntity.setAttribute('visible', 'true');
        
        // 3D modellerde şeffaflık (opacity) ayarı bazen kaplamaları bozduğu için,
        // modeli yoktan var eder gibi yavaşça büyütme (scale) taktiği kullanıyoruz.
        ataturkEntity.setAttribute('animation__appear', {
          property: 'scale',
          from: '0 0 0',
          to: '0.5 0.5 0.5', /* Modelin orijinal boyutu, gerekirse bu rakamları artırıp azaltabilirsin */
          dur: 2000,         /* 2 saniyede yavaşça ortaya çıkar */
          easing: 'easeOutElastic' /* Hafif esnek bir çıkış efekti */
        });

        // Modeli ekranda 8 saniye tut ve sonra yok et
        clearTimeout(displayTimer);
        displayTimer = setTimeout(() => {
          
          // Yavaşça küçülerek kaybolma efekti
          ataturkEntity.setAttribute('animation__disappear', {
            property: 'scale',
            from: '0.5 0.5 0.5',
            to: '0 0 0',
            dur: 2000, /* 2 saniyede küçülür */
            easing: 'easeInOutQuad'
          });
          
          // Küçülme bitince tamamen sahneden kaldır
          setTimeout(() => {
             ataturkEntity.setAttribute('visible', 'false');
          }, 2000);

        }, 8000); // 8000 milisaniye = 8 saniye
      });

      // Kamera anahtarlığı gözden kaybederse anında gizle
      target.addEventListener("targetLost", () => {
        console.log("Anahtarlık Kaybedildi!");
        clearTimeout(displayTimer);
        ataturkEntity.setAttribute('visible', 'false');
        ataturkEntity.setAttribute('scale', '0 0 0');
      });
    });
  </script>
</body>
</html>
